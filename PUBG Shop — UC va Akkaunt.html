<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUBG Shop — UC va Akkaunt</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0d14;--blue:#0a6cff;--blue2:#00b4ff;--soft:#eef4ff;--line:#d9e2f2;--mute:#5b6577;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--ink);font:500 15px Rajdhani,"Segoe UI",Arial,sans-serif;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.btn,.logo,.tab{font-family:Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;border-bottom:3px solid var(--blue)}
.logo{font-size:18px;font-weight:700}.logo b{color:var(--blue2)}
#user{display:flex;gap:6px;align-items:center}
.chip{background:#fff;color:var(--ink);padding:3px 10px;font-weight:700;font-size:14px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);cursor:pointer}
.chip b{color:var(--blue)}.chip.pl{background:var(--blue2)}
.hero{background:linear-gradient(135deg,var(--ink) 0 58%,var(--blue) 58%);color:#fff;padding:28px 14px 40px;clip-path:polygon(0 0,100% 0,100% 90%,0 100%)}
.hero h1{font-size:28px;line-height:1.05;max-width:200px}.hero h1 span{color:var(--blue2)}
.hero p{margin:8px 0 14px;max-width:180px;color:#cfd8ea;font-size:16px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.btn:hover{background:var(--ink)}.btn.sm{padding:6px 10px;font-size:12px}.btn.w{background:#fff;color:var(--ink)}.btn.k{background:var(--ink)}
.btn.bd{outline:2px solid var(--ink);outline-offset:-2px}
section{padding:18px 12px}
.title{font-size:20px;border-left:6px solid var(--blue);padding-left:10px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);padding:11px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:0 2px 0 var(--ink)}
.card .btn{width:100%}
.uc{font:700 28px Oswald,sans-serif}.uc small{font-size:14px;color:var(--blue)}
.price{font-size:18px;font-weight:700;color:var(--blue);margin:3px 0 8px}
.bonus{display:inline-block;background:var(--ink);color:#fff;font-size:12px;padding:1px 8px;margin-bottom:6px;font-weight:700}
.alt{background:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tab{background:#fff;border:2px solid var(--ink);padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rank{font:700 12px Oswald,sans-serif;background:var(--ink);color:#fff;display:inline-block;padding:2px 8px}
.acc h3{font-size:16px;margin:6px 0 2px}.acc p{color:var(--mute);font-size:14px;margin-bottom:4px}
.gar{display:inline-block;background:var(--blue);color:#fff;font:700 11px Oswald,sans-serif;padding:2px 8px;margin-bottom:4px;text-transform:uppercase}.gar.no{background:#fff;color:var(--ink);outline:2px solid var(--ink);outline-offset:-2px}
.med{position:relative;aspect-ratio:16/10;background:var(--ink);margin:-3px -3px 8px;overflow:hidden}
.med img,.med video{width:100%;height:100%;object-fit:cover;display:block}
.med.ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ink),var(--blue));color:#fff;font:700 22px Oswald,sans-serif;letter-spacing:.2em}
.tag{position:absolute;left:0;bottom:0;background:var(--blue);color:#fff;font:700 11px Oswald,sans-serif;padding:2px 8px;text-transform:uppercase}
.th{display:flex;gap:4px;margin-bottom:6px}.th img{width:34px;height:24px;object-fit:cover;border:2px solid var(--ink);cursor:pointer}
.tiles{display:grid;gap:8px;padding:12px}
.tile{background:var(--ink);color:#fff;padding:12px 14px;border-left:6px solid var(--blue);cursor:pointer}
.tile b{display:block;font:700 18px Oswald,sans-serif;text-transform:uppercase;color:var(--blue2)}.tile span{color:#cfd8ea;font-size:14px}
.av{width:60px;height:60px;background:var(--ink);border-bottom:3px solid var(--blue);display:flex;align-items:center;justify-content:center;flex:none}.av img{height:54px}
.view{display:none}.view.on{display:block}
footer{background:var(--ink);color:#aeb8cc;text-align:center;padding:14px;border-top:3px solid var(--blue);font-size:14px}footer a{color:var(--blue2);font-weight:700}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:3px;background:var(--ink);border-top:3px solid var(--blue);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#bn button{flex:1;background:none;border:0;color:#aeb8cc;font:700 10px Oswald,sans-serif;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#bn svg,#bn img{width:24px;height:24px;object-fit:contain}#bn svg{fill:currentColor}
#bn button.on{background:var(--blue);color:#fff}
.modal,#gate,#pay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto}
.modal{background:rgba(10,13,20,.7);z-index:10}.modal.on,#gate.on{display:flex}
#gate{z-index:30;background:linear-gradient(160deg,var(--ink) 0 55%,var(--blue) 55%)}
.box{background:#fff;max-width:380px;width:100%;padding:16px;border-top:5px solid var(--blue);max-height:96vh;overflow:auto}
.box h3{font-size:19px;margin-bottom:4px}.box p{color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;padding:8px;border:2px solid var(--ink);font:inherit;margin:4px 0;background:#fff;color:var(--ink)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.row .btn{flex:1}
.code{font:700 22px Oswald,sans-serif;background:var(--soft);border:2px dashed var(--blue);padding:10px;text-align:center;margin:8px 0;word-break:break-all;user-select:all}
.ad h3{font-size:16px;margin-bottom:6px}.ad{margin-bottom:12px;clip-path:none}.it{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.it img.chk{max-width:100%;max-height:140px;display:block;margin:4px 0}
.warn{background:var(--ink);color:#fff;border-left:6px solid var(--blue2);padding:8px 10px;margin:8px 0;font-size:14px}
#pay{z-index:25;background:#05070c;color:#fff;align-items:stretch;padding:0}#pay.on{display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:3px solid var(--blue);font:700 18px Oswald,sans-serif;background:repeating-linear-gradient(135deg,#0a0d14 0 10px,#0d1220 10px 20px)}
.ph button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.pb{padding:16px;max-width:420px;margin:auto;width:100%;text-align:center}.pb p{color:#aeb8cc;margin:8px 0}
.pb input{background:#0d1220;color:#fff;border-color:var(--blue)}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pk{padding:26px 8px;font:700 22px Oswald,sans-serif;letter-spacing:.1em;cursor:pointer;border:2px solid var(--blue2);background:linear-gradient(135deg,#0a0d14,#0a3a8c);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.pk.hm{background:linear-gradient(135deg,#0a6cff,#0a0d14)}.pk.big{margin-bottom:14px;cursor:default}
.cn{font:700 26px Oswald,sans-serif;letter-spacing:.08em;color:var(--blue2);word-break:break-all;user-select:all}.tm{font:700 34px Oswald,sans-serif;margin:8px 0}
.ok{width:80px;height:80px;margin:20px auto 10px;display:block}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-left:5px solid var(--blue2);z-index:40;display:none;max-width:92%;font-size:14px}
.hero{position:relative;overflow:hidden;min-height:210px}.hero>*:not(.hc){position:relative;z-index:1}.hc{position:absolute;right:-8px;bottom:0;height:185px;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.gc{display:block;height:150px;margin:0 auto 4px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.fx{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto}.fx span{background:var(--soft);border-left:4px solid var(--blue);padding:4px 10px;font:700 12px Oswald,sans-serif;text-transform:uppercase;white-space:nowrap}
#bn button{position:relative}.bdg{position:absolute;top:0;right:18%;background:#fff;color:var(--ink);font:700 10px Oswald,sans-serif;min-width:16px;padding:0 4px;font-style:normal;outline:2px solid var(--blue)}
</style>
</head>

function setp(p,v){var k=p.split("/"),o=S;for(var i=0;i<k.length-1;i++)o=o[k[i]]||(o[k[i]]={});if(v===null)delete o[k[k.length-1]];else o[k[k.length-1]]=v}
async function put(p,v){setp(p,v);if(DB_URL){try{await fetch(DB_URL+"/"+p+".json",{method:v===null?"DELETE":"PUT",body:JSON.stringify(v)})}catch(e){toast("Aloqa xatosi");return false}}else if(!sv("shop",S)){toast("Xotira to’ldi");return false}return true}

function pick(el){var a=[].slice.call(el.files),v=a.filter(function(x){return x.type.indexOf("video")==0})[0],im=a.filter(function(x){return x.type.indexOf("image")==0});
 if(v){files={v:v};$("fi").textContent="1 ta video tanlandi"}else{files={i:im.slice(0,4)};$("fi").textContent=files.i.length+" ta rasm tanlandi"}}
function rdu(x){return new Promise(function(r){var q=new FileReader();q.onload=function(){r(q.result)};q.readAsDataURL(x)})}
function cmp(x){return rdu(x).then(function(u){return new Promise(function(r){var im=new Image();im.onload=function(){var s=Math.min(1,720/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};im.src=u})})}

 else if(files&&files.i&&files.i.length){m.i=[];for(var k=0;k<files.i.length;k++)m.i.push(await cmp(files.i[k]))}
